name: Toot new posts

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

jobs:
  toot:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Toot new posts to Mastodon
        env:
          MASTODON_HOST: ${{ secrets.MASTODON_HOST }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, re, json, urllib.request, urllib.parse, yaml

          posts_dir = '_posts'
          out_file  = '_data/toots.yml'
          host  = os.environ['MASTODON_HOST']
          token = os.environ['MASTODON_TOKEN']

          existing = {}
          if os.path.exists(out_file):
              try:
                  with open(out_file, encoding='utf-8') as f:
                      existing = yaml.safe_load(f) or {}
              except yaml.YAMLError as e:
                  print(f'  warning: invalid existing {out_file}, rebuilding: {e}')

          fname_re = re.compile(r'^(\d{4})-(\d{2})-(\d{2})-(.+)\.(md|markdown)$')
          title_re = re.compile(r'^title\s*:\s*["\']?(.+?)["\']?\s*$', re.MULTILINE)
          results  = dict(existing)

          for fname in sorted(os.listdir(posts_dir)):
              m = fname_re.match(fname)
              if not m:
                  continue
              year, month, day, slug = m.group(1), m.group(2), m.group(3), m.group(4)

              # Already tooted, or seeded as intentionally skipped -- leave alone
              if slug in results:
                  continue

              with open(os.path.join(posts_dir, fname), encoding='utf-8') as f:
                  content = f.read()
              tm = title_re.search(content)
              title = tm.group(1).strip() if tm else slug

              url = f'https://www.chrismarcum.com/marcum-blog/{year}/{month}/{day}/{slug}.html'
              status = f'{title}\n\n{url}\n\n#openevidence'

              print(f'  tooting {slug}')
              req = urllib.request.Request(
                  f'https://{host}/api/v1/statuses',
                  data=urllib.parse.urlencode({'status': status, 'visibility': 'public'}).encode(),
                  headers={'Authorization': f'Bearer {token}'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)
                  results[slug] = {'host': host, 'username': data['account']['username'], 'id': str(data['id'])}
                  print(f'    -> status {data["id"]}')
              except Exception as e:
                  print(f'    -> error: {e}')

          with open(out_file, 'w', encoding='utf-8') as f:
              f.write('# Auto-generated by toot-new-posts workflow. Do not edit manually.\n')
              yaml.safe_dump(results, f, default_flow_style=False, allow_unicode=True, sort_keys=True)
          EOF

      - name: Commit updated toots.yml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/toots.yml
          git diff --staged --quiet || git commit -m "chore: record new Mastodon toots [skip ci]"
          git push
