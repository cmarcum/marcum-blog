name: Fetch Rogue Scholar DOIs

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'  # also re-check daily at 6am UTC
  workflow_dispatch:

jobs:
  fetch-dois:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DOIs from Rogue Scholar
        run: |
          python3 << 'EOF'
          import os, re, urllib.request, urllib.parse, json, time, difflib

          posts_dir = '_posts'
          data_dir  = '_data'
          out_file  = os.path.join(data_dir, 'dois.yml')
          os.makedirs(data_dir, exist_ok=True)

          import yaml

          # Load existing data so we don't overwrite already-resolved DOIs.
          # A malformed file must not crash the run -- fall back to empty so
          # this script can still regenerate a valid dois.yml.
          existing = {}
          if os.path.exists(out_file):
              try:
                  with open(out_file, encoding='utf-8') as f:
                      existing = yaml.safe_load(f) or {}
              except yaml.YAMLError as e:
                  print(f'  warning: existing {out_file} is invalid YAML, rebuilding from scratch: {e}')

          title_re = re.compile(r'^title\s*:\s*["\']?(.+?)["\']?\s*$', re.MULTILINE)
          results  = dict(existing)

          for fname in sorted(os.listdir(posts_dir)):
              if not (fname.endswith('.md') or fname.endswith('.markdown')):
                  continue
              slug = re.sub(r'^\d{4}-\d{2}-\d{2}-', '', fname).rsplit('.', 1)[0]

              # Skip if we already have a DOI for this post
              if slug in results and results[slug].get('doi'):
                  print(f'  {slug}: already resolved, skipping')
                  continue

              with open(os.path.join(posts_dir, fname), encoding='utf-8') as f:
                  content = f.read()
              m = title_re.search(content)
              if not m:
                  continue
              title = m.group(1).strip()

              # FIX 1: Add literal double-quotes around the title for an exact phrase search
              q   = urllib.parse.quote(f'"{title}"')
              url = f'https://rogue-scholar.org/api/communities/chrismarcum/records?size=1&q={q}'
              print(f'  {slug}: querying for "{title}"')

              try:
                  req  = urllib.request.Request(url, headers={'User-Agent': 'jekyll-doi-fetcher/1.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.load(r)
                  hits = data.get('hits', {}).get('hits', [])
                  
                  if hits:
                      rec = hits[0]
                      rs_title = rec.get('metadata', {}).get('title', title)
                      
                      # FIX 2: Validate that the returned title actually matches our post
                      similarity = difflib.SequenceMatcher(None, title.lower(), rs_title.lower()).ratio()
                      
                      if similarity > 0.5: # Requires titles to be at least 50% similar
                          doi = (rec.get('pids', {}).get('doi', {}).get('identifier')
                                 or rec.get('doi'))
                          results[slug] = {'doi': doi, 'title': rs_title}
                          print(f'    -> DOI: {doi}')
                      else:
                          results[slug] = {'doi': None, 'title': title}
                          print(f'    -> not yet indexed (API returned mismatch: "{rs_title}")')
                  else:
                      results[slug] = {'doi': None, 'title': title}
                      print(f'    -> not yet indexed')
              except Exception as e:
                  print(f'    -> error: {e}')
              time.sleep(0.5)  # be polite to the API

          out = {
              slug: {'doi': rec['doi'] or None, 'title': rec['title']}
              for slug, rec in sorted(results.items())
          }
          with open(out_file, 'w', encoding='utf-8') as f:
              f.write('# Auto-generated by fetch-dois workflow. Do not edit manually.\n')
              yaml.safe_dump(out, f, default_flow_style=False, allow_unicode=True, sort_keys=True)

          print(f'\nWrote {len(results)} entries to {out_file}')
          EOF

      - name: Commit updated dois.yml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/dois.yml
          git diff --staged --quiet || git commit -m "chore: update Rogue Scholar DOIs [skip ci]"
          git push
